[package]
name = "alc-core-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "wasm32 (Cloudflare Workers) でもビルドできる alc-core の共有部分: 型・エラー・X-Tenant-ID ミドルウェア"
repository = "https://github.com/ippoan/alc-worker-kit"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage)'] }

# wasm32 でビルドできることが存在理由。sqlx / reqwest / ring / jsonwebtoken / tokio /
# openssl を通常依存に入れないこと (sqlx は optional feature のみ)。
[dependencies]
axum = { version = "0.8", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, optional = true }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }

[features]
default = []
sqlx = ["dep:sqlx"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
